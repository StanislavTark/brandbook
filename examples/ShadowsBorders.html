<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ShadowsBorders</title>
<style>html,body{margin:0;background:var(--bg,#ffffff)}body{padding:16px;font-family:var(--font-sans,"Inter","Segoe UI",Arial,sans-serif);color:var(--ink,#14171c);font-size:13px}</style><link rel="stylesheet" href="bundle.css">
<meta name="robots" content="noindex">
</head>
<body class="ib-page">
<style>.lbl{font-size:0.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#52514e);margin:0 0 8px}.mono{font-family:Consolas,"Courier New",monospace;font-size:11px}.cap{font-size:0.75rem;color:var(--muted,#52514e)}</style><div class="lbl">Тени</div><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:18px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:#fff;box-shadow:0 0 0 1px #e3e2dd"></div><b class="mono" style="font-size:12px">shadow-outline</b><span class="cap">рамка таблицы/графика</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:#fff;box-shadow:0 4px 14px rgba(20,23,28,.14)"></div><b class="mono" style="font-size:12px">shadow-tooltip</b><span class="cap">подсказка, меню</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:#fff;box-shadow:0 1px 6px rgba(17,133,179,.08), 0 0 0 1px #e3e2dd"></div><b class="mono" style="font-size:12px">shadow-search</b><span class="cap">поле поиска</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:#fff;box-shadow:inset 0 3px 0 #184f95"></div><b class="mono" style="font-size:12px">shadow-tab</b><span class="cap">активная вкладка</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:#fff;box-shadow:0 0 0 2px #fff, 0 0 0 4px #2a78d6"></div><b class="mono" style="font-size:12px">shadow-hover</b><span class="cap">наведение btn-title</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:64px;border-radius:8px;background:#fff;box-shadow:0 0 0 2px #184f95, 0 0 0 4px rgba(24,79,149,.45)"></div><b class="mono" style="font-size:12px">shadow-focus</b><span class="cap">фокус btn-title</span></div></div><div class="lbl" style="margin-top:18px">Рамки</div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px"><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:0;border-bottom:2px solid #184f95"></div><b class="mono" style="font-size:12px">border-header</b><span class="cap">линия под заголовком</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:8px;border-top:3px solid #2a78d6;background:#f2f5f9"></div><b class="mono" style="font-size:12px">border-kpi</b><span class="cap">полоса плитки KPI</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:0;border-bottom:1px solid #e3e2dd"></div><b class="mono" style="font-size:12px">border-line</b><span class="cap">под вкладками</span></div><div style="display:flex;flex-direction:column;gap:6px"><div style="height:56px;border-radius:0 6px 6px 0;border-left:4px solid #eb6834;background:#fff7f2"></div><b class="mono" style="font-size:12px">border-callout</b><span class="cap">врезка</span></div></div>
<script>/* статичное превью */</script>
</body></html>
