<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ActionButtons</title>
<style>html,body{margin:0;background:var(--bg,#ffffff)}body{padding:16px;font-family:var(--font-sans,"Inter","Segoe UI",Arial,sans-serif);color:var(--ink,#14171c);font-size:13px}</style><link rel="stylesheet" href="bundle.css">
